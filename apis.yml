aid: aig-aerospace
name: AIG Aerospace
url: https://raw.githubusercontent.com/api-evangelist/aig-aerospace/refs/heads/main/apis.yml
description: >-
  AIG Aerospace is the aviation and aerospace specialty insurance business of American International
  Group, Inc. (AIG), underwriting hull and liability cover for airlines, general aviation owners and
  operators, aircraft and component manufacturers, MRO and distribution businesses, airports, ground
  handlers and service providers, and unmanned aircraft systems, backed by dedicated aerospace claims
  adjusters and aviation attorneys on a 24/7 hotline. It is a line of business rather than a software
  company: it publishes no developer portal, no OpenAPI or other machine-readable contract, no SDK,
  no webhooks and no self-service signup. Its public surface is marketing pages on aig.com plus PDF
  application forms; quoting and binding run through appointed brokers and claims through
  authenticated AIG portals. AIG's one API gateway, commercial.api.aig.com, is contract-only, serves
  the parent's broker applications rather than aerospace, and is profiled at api-evangelist/aig.
